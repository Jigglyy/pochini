<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pochini</title>
    <!-- Resolve the theme before any CSS or JS loads, so the first paint is
         the right colour. src/lib/theme.ts takes over at runtime. -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem("pochini.settings") || "{}").theme || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
