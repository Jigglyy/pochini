<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pochini app icon. Source of truth for every generated icon:
       npm run icons  (runs `tauri icon` on this file).
       Style follows Kanbini's mark: dark navy tile, flat pastel shapes.
       Motif: "pochi", the sound of pressing a button. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252c4a"/>
      <stop offset="1" stop-color="#141929"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b8ea"/>
      <stop offset="1" stop-color="#ec9ddd"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="40" y="40" width="944" height="944" rx="208" fill="url(#tile)"/>
  <rect x="44" y="44" width="936" height="936" rx="204" fill="none" stroke="#3c4572" stroke-width="8" opacity="0.8"/>

  <!-- artwork, scaled up a little so it fills the tile at small sizes -->
  <g transform="translate(512 580) scale(1.12) translate(-512 -580)">

  <!-- impact lines: "pochi!" -->
  <g stroke-linecap="round" stroke-width="36" fill="none">
    <line x1="318" y1="438" x2="252" y2="372" stroke="#8fe6bd"/>
    <line x1="498" y1="392" x2="498" y2="300" stroke="#f7c08e"/>
    <line x1="678" y1="438" x2="744" y2="372" stroke="#8fe6bd"/>
  </g>

  <!-- button: base plate, side, top -->
  <ellipse cx="498" cy="652" rx="306" ry="122" fill="#0f1322" opacity="0.55"/>
  <ellipse cx="498" cy="636" rx="296" ry="116" fill="#313a63"/>
  <path d="M 286 572 L 286 614 A 212 84 0 0 0 710 614 L 710 572 Z" fill="#c278b6"/>
  <ellipse cx="498" cy="572" rx="212" ry="84" fill="url(#top)"/>
  <ellipse cx="444" cy="548" rx="104" ry="28" fill="#ffffff" opacity="0.35"/>

  <!-- cursor pressing it -->
  <g transform="translate(548 552) scale(0.86)">
    <path d="M0 0 L0 360 L92 270 L156 404 L222 374 L158 242 L276 242 Z"
          transform="translate(12 16)" fill="#0b0e19" opacity="0.4"/>
    <path d="M0 0 L0 360 L92 270 L156 404 L222 374 L158 242 L276 242 Z"
          fill="#ffffff" stroke="#141929" stroke-width="24" stroke-linejoin="round"/>
  </g>
  </g>
</svg>
