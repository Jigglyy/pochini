# Weekly dependency updates, grouped so each ecosystem is one pull request.
# CI checks every one; run `npm run notices` before the next release so the
# third-party notices match (scripts/release.mjs does it).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 3

  # Keeps the commit-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
