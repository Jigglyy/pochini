name: Release

# Publish a version by pushing its tag (scripts/release.mjs prints these):
#
#   git tag v0.5.0
#   git push origin main v0.5.0
#
# A Windows runner checks that the tag matches the version in package.json
# and src-tauri/Cargo.toml, runs the Rust tests and the frontend type-check,
# builds the app, and publishes a GitHub Release named "Pochini v0.5.0" with
# Pochini-0.5.0.exe attached and that version's CHANGELOG.md section as the
# notes. Same shape as Kanbini's release workflow.
#
# The .exe is unsigned: SmartScreen shows "unknown publisher" on first run.

on:
  push:
    tags:
      - "v*"
  # Dry run from the Actions tab: builds and keeps the .exe as a run
  # artifact, but creates no Release (that only happens on a tag).
  workflow_dispatch:

# Never cancel a release build half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Lets the built-in GITHUB_TOKEN create the Release and upload the .exe.
  contents: write

jobs:
  windows:
    name: Build Pochini for Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The version lives in the repo (scripts/release.mjs bumps it before
      # the tag is made), so a tag that disagrees means a mistake: stop
      # rather than publish an .exe whose About screen shows another number.
      - name: Read version
        id: version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$PKG" != "$CARGO" ]; then
            echo "::error::package.json is $PKG but src-tauri/Cargo.toml is $CARGO"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$PKG" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      # Tagging is a separate, deliberate act; don't ship a build that
      # fails the gate.
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build (type-check, frontend, release exe)
        run: npm run tauri build -- --no-bundle

      - name: Name the exe
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/pochini.exe "release/Pochini-${{ steps.version.outputs.version }}.exe"

      - name: Upload exe as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pochini-${{ steps.version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error

      # Release notes are this version's section of CHANGELOG.md.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const s = require('fs').readFileSync('CHANGELOG.md', 'utf8');
            const start = s.indexOf('## ' + process.env.VERSION + ' ');
            if (start < 0) { console.error('No CHANGELOG.md section for ' + process.env.VERSION); process.exit(1); }
            const body = s.slice(start).split('\n').slice(1).join('\n');
            const end = body.search(/^## /m);
            require('fs').writeFileSync('notes.md', (end < 0 ? body : body.slice(0, end)).trim() + '\n');
          "
          gh release create "$GITHUB_REF_NAME" release/*.exe \
            --title "Pochini $GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag
