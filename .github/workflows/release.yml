name: Release

# Publish a version by pushing its release commit to main
# (scripts/release.mjs prints the steps):
#
#   git commit -am "chore(release): 0.7.0"
#   git push origin main
#
# A Windows runner checks that the commit message, package.json and
# src-tauri/Cargo.toml agree on the version, builds the app, and publishes a
# GitHub Release "Pochini v0.7.0" (creating the v0.7.0 tag on that commit)
# with Pochini-0.7.0.exe attached and that version's CHANGELOG.md section as
# the notes. Same shape as Kanbini's release workflow.
#
# Why main and not a tag push: GitHub scopes the build cache to the ref a run
# starts from, and a tag run can only read caches from its own tag or main. Tag
# runs therefore always compiled every dependency from scratch (~20 minutes).
# Runs on main share one cache, so each release only rebuilds what changed.
#
# The tests are not run here: `cargo test` and `npm run e2e` run locally
# before every release (CLAUDE.md > Releases), and a second, debug-profile
# compile of everything here cost about 6 minutes per release.
#
# Other pushes to main skip the job without starting a runner. A manual run
# from the Actions tab is a dry run: it builds and keeps the .exe as a run
# artifact, with no Release.
#
# The .exe is unsigned: SmartScreen shows "unknown publisher" on first run.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release build half-way.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  # Lets the built-in GITHUB_TOKEN create the Release, its tag, and upload the .exe.
  contents: write

jobs:
  windows:
    name: Build Pochini for Windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # The version lives in the repo (scripts/release.mjs bumps it), so a
      # disagreement means a mistake: stop rather than publish an .exe whose
      # About screen shows another number.
      - name: Read version
        id: version
        shell: bash
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$PKG" != "$CARGO" ]; then
            echo "::error::package.json is $PKG but src-tauri/Cargo.toml is $CARGO"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            SUBJECT=$(printf '%s' "$MESSAGE" | head -n1)
            if [ "$SUBJECT" != "chore(release): $PKG" ]; then
              echo "::error::release commit says \"$SUBJECT\" but package.json is $PKG"
              exit 1
            fi
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"

      - name: Build (type-check, frontend, release exe)
        run: npm run tauri build -- --no-bundle

      - name: Name the exe
        shell: bash
        run: |
          mkdir -p release
          cp src-tauri/target/release/pochini.exe "release/Pochini-${{ steps.version.outputs.version }}.exe"

      - name: Upload exe as a run artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pochini-${{ steps.version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error

      # Release notes are this version's section of CHANGELOG.md. The tag is
      # created on the release commit.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node -e "
            const s = require('fs').readFileSync('CHANGELOG.md', 'utf8');
            const start = s.indexOf('## ' + process.env.VERSION + ' ');
            if (start < 0) { console.error('No CHANGELOG.md section for ' + process.env.VERSION); process.exit(1); }
            const body = s.slice(start).split('\n').slice(1).join('\n');
            const end = body.search(/^## /m);
            require('fs').writeFileSync('notes.md', (end < 0 ? body : body.slice(0, end)).trim() + '\n');
          "
          gh release create "v$VERSION" release/*.exe \
            --target "$GITHUB_SHA" \
            --title "Pochini v$VERSION" \
            --notes-file notes.md
