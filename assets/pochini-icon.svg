<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pochini app icon. Source of truth for every generated icon:
       npm run icons  (runs `tauri icon` on this file).
       Style follows Kanbini's mark: dark navy tile, flat pastel shapes.
       Motif: "pochi", the sound of pressing a button.
       Drawn large on purpose: the artwork fills most of a near full-bleed
       tile so it stays readable at 16 and 32 px (taskbar, title bar). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262e4e"/>
      <stop offset="1" stop-color="#141929"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8bdec"/>
      <stop offset="1" stop-color="#ec9ddd"/>
    </linearGradient>
  </defs>

  <!-- tile, nearly full bleed -->
  <rect x="8" y="8" width="1008" height="1008" rx="224" fill="url(#tile)"/>
  <rect x="13" y="13" width="998" height="998" rx="219" fill="none" stroke="#3c4572" stroke-width="10" opacity="0.8"/>

  <!-- impact lines: "pochi!" -->
  <g stroke-linecap="round" stroke-width="62" fill="none">
    <line x1="214" y1="318" x2="138" y2="236" stroke="#8fe6bd"/>
    <line x1="500" y1="286" x2="500" y2="158" stroke="#f7c08e"/>
    <line x1="786" y1="318" x2="862" y2="236" stroke="#8fe6bd"/>
  </g>

  <!-- button: base plate, side, top -->
  <ellipse cx="500" cy="628" rx="448" ry="170" fill="#0b0f1c" opacity="0.5"/>
  <ellipse cx="500" cy="610" rx="440" ry="165" fill="#323b66"/>
  <path d="M 180 505 L 180 565 A 320 125 0 0 0 820 565 L 820 505 Z" fill="#c278b6"/>
  <ellipse cx="500" cy="505" rx="320" ry="125" fill="url(#top)"/>
  <ellipse cx="420" cy="470" rx="160" ry="40" fill="#ffffff" opacity="0.35"/>

  <!-- cursor pressing it -->
  <g transform="translate(560 478) scale(1.15)">
    <path d="M0 0 L0 360 L92 270 L156 404 L222 374 L158 242 L276 242 Z"
          transform="translate(12 16)" fill="#0b0e19" opacity="0.4"/>
    <path d="M0 0 L0 360 L92 270 L156 404 L222 374 L158 242 L276 242 Z"
          fill="#ffffff" stroke="#141929" stroke-width="26" stroke-linejoin="round"/>
  </g>
</svg>
