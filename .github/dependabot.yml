# Weekly dependency updates, grouped so each ecosystem is one pull request.
# CI checks every one; run `npm run notices` before the next release so the
# third-party notices match (scripts/release.mjs does it).
#
# Breaking upgrades are left out: major versions everywhere, and minor
# versions of the 0.x crates whose minors break (windows, rand). Bundled into
# one pull request they could not compile; they get migrated by hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "windows"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "rand"
        update-types: ["version-update:semver-minor"]
    open-pull-requests-limit: 3

  # Keeps the commit-pinned actions in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
