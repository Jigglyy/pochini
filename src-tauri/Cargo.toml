[package]
name = "pochini"
version = "0.14.3"
description = "Pochini: screen-coordinate click macros with global hotkeys"
authors = ["Jigglyy"]
license = "MIT"
repository = "https://github.com/Jigglyy/pochini"
edition = "2021"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "pochini_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rand = "0.8"
ulid = { version = "1", features = ["serde"] }
arc-swap = "1"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tauri-plugin-window-state = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
lto = "thin"
opt-level = 3
# Unwind, not abort: a panic in a macro run is caught so the release pass can
# let go of every key and button it held (engine::Engine::run_at).
panic = "unwind"
strip = true
